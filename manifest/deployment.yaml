apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: 100foldtechnologies/planning-app:8b6ef2bad389ae64fe8e229fab48b3ea07a0abfb
        ports:
        - containerPort: 3000
